name: OutbreakWatch CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Synthetic Data Verification
        run: |
          python data-pipeline/generator.py

      - name: Run Automated Test Suite (EARS, CUSUM, Privacy, APIs)
        run: |
          cd backend
          pytest -v
